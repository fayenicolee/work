<style>
  :root{
    --bg-page:#150E2A;
    --paper:#FAF6FF;
    --paper-2:#F0E9FC;
    --ink:#1E1533;
    --ink-soft:#5C5478;
    --muted:#847AA0;
    --accent:#D6249F;
    --accent-strong:#A6127B;
    --teal:#0EA5B0;
    --line:rgba(30,21,51,0.14);
    --shadow:rgba(21,10,40,0.28);
    --focus:#A6127B;
    --cat-filter:none;

    --cat-1:#FF6FD8; --cat-2:#5FE0B0; --cat-3:#4FCBFF; --cat-4:#FF8F70; --cat-5:#B98CFF;
    --cat-6:#FFD84D; --cat-7:#3DE0C2; --cat-8:#7C9CFF; --cat-9:#FFB25C; --cat-10:#C08CFF;
    --cat-11:#FF6B8A; --cat-12:#C6F24D; --cat-13:#4FE0A0; --cat-14:#F26FD1; --cat-15:#4FD8E8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-page:#08050F; --paper:#170F2B; --paper-2:#211537;
      --ink:#F5EFFF; --ink-soft:#CBBFE6; --muted:#9C8FBE;
      --accent:#FF8CEC; --accent-strong:#FFB0F0; --teal:#5EEAD4;
      --line:rgba(245,239,255,0.14); --shadow:rgba(0,0,0,0.55); --focus:#FFB0F0;
      --cat-filter:saturate(1.15);
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#08050F; --paper:#170F2B; --paper-2:#211537;
    --ink:#F5EFFF; --ink-soft:#CBBFE6; --muted:#9C8FBE;
    --accent:#FF8CEC; --accent-strong:#FFB0F0; --teal:#5EEAD4;
    --line:rgba(245,239,255,0.14); --shadow:rgba(0,0,0,0.55); --focus:#FFB0F0;
    --cat-filter:saturate(1.15);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg-page); overflow:hidden; }
  body{
    font-family:"Google Sans", "Outfit", ui-sans-serif, system-ui, sans-serif;
    color:var(--ink);
  }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }

  .stage-outer{ position:fixed; inset:0; background:var(--bg-page); }
  .stage{
    position:absolute; top:50%; left:50%; width:1280px; height:720px;
    transform-origin:center center;
    background:var(--paper);
    border-radius:22px;
    box-shadow:0 40px 90px var(--shadow);
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:border-radius .2s ease, box-shadow .2s ease;
  }
  .stage.is-fullscreen{ border-radius:0; box-shadow:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 40px 0; flex:0 0 auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; color:var(--ink); }
  .brand svg{ width:60px; height:60px; color:var(--accent); }
  .brand span{
    font-family:"Nabla", "Google Sans", "Outfit", sans-serif; font-weight:400; font-size:66px;
    letter-spacing:.5px; text-transform:uppercase;
    font-variation-settings:"EDPT" 100, "EHLT" 24;
  }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }

  .pill-btn{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--accent); color:var(--paper);
    border:none; border-radius:999px; padding:10px 20px;
    font-size:15.5px; font-weight:600; letter-spacing:.2px;
    cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .pill-btn:hover{ background:var(--accent-strong); transform:translateY(-1px); }
  .pill-btn svg{ width:34px; height:34px; }
  .pill-btn.ghost{
    background:transparent; color:var(--accent-strong);
    border:1.5px solid var(--accent-strong);
  }
  .pill-btn.ghost:hover{ background:var(--accent-strong); color:var(--paper); }

  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:72px; height:72px; border-radius:50%;
    background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);
    cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background:var(--paper-2); color:var(--ink); }
  .icon-btn svg{ width:32px; height:32px; }

  .view{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .view[hidden]{ display:none; }

  .cover-view{ align-items:center; padding-top:6px; }
  .subtitle{
    margin:4px 0 14px; text-align:center; max-width:820px;
    font-size:18.5px; color:var(--ink-soft); line-height:1.5;
    text-wrap:balance;
  }

  .grid{
    width:100%; flex:1; min-height:0;
    display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(3,minmax(min-content,1fr));
    gap:10px; padding:0 40px 12px;
  }
  .tile{
    position:relative; text-align:left; cursor:pointer;
    background:var(--paper-2); border:1px solid var(--line); border-radius:14px;
    padding:8px 14px 8px; display:flex; flex-direction:column; gap:3px;
    overflow-y:auto; overflow-x:hidden; scrollbar-width:thin;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  .tile::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:var(--tile-accent); filter:var(--cat-filter);
  }
  .tile:hover{ transform:translateY(-3px); box-shadow:0 10px 20px var(--shadow); }
  .tile-badge{
    width:66px; height:66px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--tile-accent) 0%, color-mix(in srgb, var(--tile-accent) 42%, white) 100%);
    filter:var(--cat-filter);
    font-size:35px; line-height:1;
  }
  .tile-title{
    font-family:"Google Sans", "Outfit", sans-serif; font-weight:600; font-size:16px;
    color:var(--ink); letter-spacing:.1px;
  }
  .tile-teaser{
    font-size:13px; color:var(--muted); line-height:1.22;
  }

  .detail-view{ padding:20px 48px 34px; gap:18px; }
  .back-btn{
    align-self:flex-start; display:inline-flex; align-items:center; gap:7px;
    background:none; border:none; color:var(--ink-soft); font-size:15.5px; font-weight:600;
    cursor:pointer; padding:6px 2px;
  }
  .back-btn:hover{ color:var(--ink); }
  .back-btn svg{ width:32px; height:32px; }

  .detail-inner{ flex:1; min-height:0; display:flex; gap:30px; align-items:stretch; }
  .detail-side{ flex:0 0 230px; display:flex; flex-direction:column; align-items:flex-start; gap:14px; }
  .detail-badge{
    width:184px; height:184px; border-radius:50%;
    background:linear-gradient(145deg, var(--tile-accent) 0%, color-mix(in srgb, var(--tile-accent) 42%, white) 100%);
    filter:var(--cat-filter);
    display:flex; align-items:center; justify-content:center; font-size:92px;
  }
  .detail-tagline{ font-size:16.5px; color:var(--muted); line-height:1.4; margin:0; }
  .detail-title{
    font-family:"Google Sans", "Outfit", sans-serif; font-weight:600; font-size:27px;
    margin:0; letter-spacing:.2px; text-wrap:balance;
  }

  .prompt-card{
    flex:1; min-height:0; overflow-y:auto;
    background:var(--paper-2); border:1px solid var(--line); border-radius:18px;
    padding:30px 34px; display:flex; flex-direction:column; gap:16px;
    justify-content:center;
  }
  .prompt-counter{
    margin:0; font-family:"Google Sans", "Outfit", sans-serif; font-size:13px;
    font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent-strong);
  }
  .prompt-text{
    margin:0; font-family:"Google Sans", "Outfit", sans-serif; font-weight:600; font-size:35px;
    line-height:1.28; color:var(--ink); text-wrap:balance;
  }
  .prompt-try{
    margin:0; font-style:italic; font-size:17.5px; color:var(--ink-soft);
  }
  .prompt-try span{ font-style:normal; font-weight:600; color:var(--accent-strong); margin-right:5px; }
  .prompt-foot{ margin:0; font-size:15px; color:var(--muted); line-height:1.5; }
  .steps-list{ margin:0; padding-left:22px; display:flex; flex-direction:column; gap:10px; }
  .steps-list li{
    font-family:"Google Sans", "Outfit", sans-serif; font-size:22px; font-weight:500;
    line-height:1.4; color:var(--ink); padding-left:4px;
  }
  .question-label{
    font-family:"Google Sans", "Outfit", sans-serif; font-size:13px;
    font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted);
  }
  .question-input{
    font-family:"Google Sans", "Outfit", sans-serif; font-size:18px; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--line); border-radius:10px;
    padding:12px 15px; width:100%;
  }
  .question-input:focus{ border-color:var(--accent); }
  .prompt-actions{ padding-top:6px; }
  .audio-row{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding-top:2px; }
  .lang-select{
    font-family:"Google Sans", "Outfit", sans-serif; font-size:15px; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--line); border-radius:999px;
    padding:9px 16px; cursor:pointer;
  }
  .lang-select:focus{ border-color:var(--accent); outline:none; }
  .speak-btn{
    display:inline-flex; align-items:center; gap:7px;
    background:transparent; color:var(--accent-strong);
    border:1.5px solid var(--accent-strong); border-radius:999px;
    padding:9px 18px; font-size:15px; font-weight:600;
    cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .speak-btn:hover{ background:var(--accent-strong); color:var(--paper); }
  .speak-btn:disabled{ opacity:.5; cursor:default; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>

<div class="stage-outer">
  <div class="stage" id="stage">
    <div class="topbar">
      <div class="brand">
        <span>Let's Explore...</span>
      </div>
      <div class="topbar-actions">
        <button class="pill-btn" id="surpriseBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          Surprise me
        </button>
        <button class="icon-btn" id="fsBtn" aria-label="Toggle full screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </div>

    <section class="view cover-view" id="coverView">
      <div class="grid" id="grid"></div>
    </section>

    <section class="view detail-view" id="detailView" hidden>
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to cards
      </button>
      <div class="detail-inner">
        <div class="detail-side">
          <div class="detail-badge" id="detailBadge"></div>
          <p class="detail-tagline" id="detailTagline"></p>
          <h2 class="detail-title" id="detailTitle"></h2>
        </div>
        <div class="prompt-card" id="promptCard"></div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  var categories = [
    { emoji:"🪏", title:"Dig Deeper", tagline:"Is there more to this than meets the eye?", mode:"random",
      pool:[
        "Is there anything interesting about this that we haven't talked about enough?",
        "What would I like to understand better?",
        "What happens if I keep asking “why?”",
        "What more could I find out about that would surprise my teacher?",
        "Why else might this have happened?"
      ], tryLine:"I wonder why…" },
    { emoji:"🐇", title:"Go Down a Rabbit Hole", tagline:"Follow something that catches your attention.", mode:"sequential",
      steps:[
        "Choose one detail, idea, person, place or question from today's learning.",
        "Investigate it for 5–10 minutes.",
        "Come back with one thing worth telling someone else about."
      ], footNote:"Remember — you don't have to know where you're going before you start." },
    { emoji:"🔗", title:"Make a Connection", tagline:"Where else does this belong?", mode:"random",
      pool:[
        "Does this connect to another subject?",
        "Does this connect to something happening in the world?",
        "Does this connect to your own life?",
        "Does this connect to something you've read, watched or played?",
        "Does this connect to something you learned years ago?",
        "Does this connect to another concept you've learned about?"
      ], tryLine:"This reminds me of…" },
    { emoji:"🤨", title:"Question It", tagline:"Don't automatically accept the information you're given.", mode:"random",
      pool:[
        "How do we actually know this?",
        "Who is telling us it's true and accurate?",
        "What evidence supports it?",
        "What information might be missing?",
        "Who might disagree with this?",
        "Could the opposite ever be true?"
      ], tryLine:"But what if…" },
    { emoji:"👀", title:"Change Perspective", tagline:"Look at the same thing from another perspective.", mode:"random",
      pool:[
        "How might this look to someone in another country?",
        "How might this look to someone 100 years ago?",
        "How might this look to someone 100 years from now?",
        "How might this look to someone affected by this?",
        "How might this look to someone who completely disagrees with you?",
        "How might this change if it was explained in another language?"
      ], tryLine:"From their perspective…" },
    { emoji:"🧪", title:"Experiment", tagline:"Experiment and see where it takes you!", mode:"sequential",
      steps:[
        "Change something about this.",
        "Make a prediction about what might happen.",
        "Test your changes.",
        "Explore what happened.",
        "Reflect — even if it didn't work out!"
      ] },
    { emoji:"🛠️", title:"Make Something", tagline:"Turn the learning into something that didn't exist before.", mode:"random",
      pool:[ "a model", "a diagram", "a prototype for a product (a sketch or a model)", "a game idea", "an image", "an animation", "a short story", "a map", "a 30 second non-AI video", "an infographic", "a physical object", "a short script for a play" ],
      template:"Could you make {item} that shows this idea better than a paragraph would?" },
    { emoji:"🌍", title:"Make It Real", tagline:"Take it outside the classroom.", mode:"random",
      pool:[
        "Where does this exist in real life?",
        "Who actually uses this knowledge?",
        "What problem could it help solve?",
        "Who could you ask about it to learn more?"
      ], tryLine:"In the real world, this matters because…" },
    { emoji:"🎯", title:"Choose Your Own Challenge", tagline:"Challenge yourself to explore this idea in a way that's…", mode:"random",
      pool:[
        "Easier → explain the idea clearly to someone else.",
        "Deeper → investigate something the lesson doesn't answer.",
        "Harder → attempt something you're not sure you can do.",
        "Different → find another way to approach the task."
      ] },
    { emoji:"🧠", title:"Use AI as a Thinking Partner", tagline:"Don't ask AI to do the thinking for you — use it to make the topic more interesting.", mode:"random",
      pool:[
        "Ask AI to challenge your idea.",
        "Ask AI to give you an opposing viewpoint.",
        "Ask AI to ask you difficult questions.",
        "Ask AI to suggest something you haven't considered.",
        "Ask AI to help you find a rabbit hole.",
        "Ask AI to role-play an expert you can question.",
        "Ask AI to critique something you've made."
      ] },
    { emoji:"💥", title:"Break the Task", tagline:"What if you weren't given these instructions?", mode:"sequential",
      steps:[
        "Keep the learning goal — but rethink the route.",
        "Is there another way you could demonstrate that you've understood it?",
        "Propose your alternative to your teacher."
      ], tryLine:"Could I show my understanding by…?" },
    { emoji:"❓", title:"Create a Better Question", tagline:"Sometimes the question is more interesting than the answer.", mode:"random",
      pool:[
        "Turn today's topic into a question that doesn't have one obvious answer.",
        "Turn today's topic into a question that makes you curious.",
        "Turn today's topic into a question that could lead to disagreement.",
        "Turn today's topic into a question that connects several ideas.",
        "Turn today's topic into a question you'd genuinely like to investigate."
      ] },
    { emoji:"🕵️", title:"Find the Weird Thing", tagline:"Look for the exception, mystery or contradiction.", mode:"random",
      pool:[ "unexpected", "disputed", "unexplained", "an exception to the rule", "surprisingly complicated", "just plain strange!" ],
      template:"What's {item} about this? Investigate it." },
    { emoji:"🚧", title:"Get Unstuck", tagline:"Being stuck is part of exploring.", mode:"sequential",
      steps:[
        "Identify exactly where you're stuck and what's stopping your progress.",
        "Try a different approach.",
        "Look for an example that someone else has done.",
        "Ask someone a specific question that will help you to move forward.",
        "Use a resource or AI for a clue, not the solution."
      ] },
    { emoji:"🧩", title:"Concept Picker", tagline:"How does this relate to the following concept?", mode:"random", hasAudio:true,
      pool:[
        "Aesthetics", "Change", "Communication", "Communities", "Connections", "Creativity",
        "Culture", "Development", "Form", "Global interactions", "Identity", "Logic",
        "Perspective", "Relationships", "Systems", "Time, place and space"
      ] }
  ];

  // Languages offered in the Concept Picker's audio dropdown, and the
  // BCP-47 tag passed to the browser's speech synthesizer for each.
  var AUDIO_LANGS = [
    { key:"en", label:"English", speechLang:"en-US" },
    { key:"es", label:"Español", speechLang:"es-ES" },
    { key:"fr", label:"Français", speechLang:"fr-FR" },
    { key:"de", label:"Deutsch", speechLang:"de-DE" },
    { key:"pt", label:"Português", speechLang:"pt-PT" },
    { key:"zh", label:"中文", speechLang:"zh-CN" },
    { key:"ja", label:"日本語", speechLang:"ja-JP" },
    { key:"ar", label:"العربية", speechLang:"ar-SA" },
    { key:"hi", label:"हिन्दी", speechLang:"hi-IN" }
  ];

  // Translations of each Concept Picker word, used so the dropdown speaks
  // the concept in the chosen language rather than just reading the
  // English word with an accent. English uses the pool word itself.
  var CONCEPT_TRANSLATIONS = {
    "Aesthetics": { es:"Estética", fr:"Esthétique", de:"Ästhetik", pt:"Estética", zh:"美学", ja:"美学", ar:"الجماليات", hi:"सौंदर्यशास्त्र" },
    "Change": { es:"Cambio", fr:"Changement", de:"Veränderung", pt:"Mudança", zh:"变化", ja:"変化", ar:"التغيير", hi:"परिवर्तन" },
    "Communication": { es:"Comunicación", fr:"Communication", de:"Kommunikation", pt:"Comunicação", zh:"交流", ja:"コミュニケーション", ar:"التواصل", hi:"संचार" },
    "Communities": { es:"Comunidades", fr:"Communautés", de:"Gemeinschaften", pt:"Comunidades", zh:"社区", ja:"コミュニティ", ar:"المجتمعات", hi:"समुदाय" },
    "Connections": { es:"Conexiones", fr:"Connexions", de:"Verbindungen", pt:"Conexões", zh:"联系", ja:"つながり", ar:"الروابط", hi:"संबंध" },
    "Creativity": { es:"Creatividad", fr:"Créativité", de:"Kreativität", pt:"Criatividade", zh:"创造力", ja:"創造性", ar:"الإبداع", hi:"रचनात्मकता" },
    "Culture": { es:"Cultura", fr:"Culture", de:"Kultur", pt:"Cultura", zh:"文化", ja:"文化", ar:"الثقافة", hi:"संस्कृति" },
    "Development": { es:"Desarrollo", fr:"Développement", de:"Entwicklung", pt:"Desenvolvimento", zh:"发展", ja:"発展", ar:"التطور", hi:"विकास" },
    "Form": { es:"Forma", fr:"Forme", de:"Form", pt:"Forma", zh:"形式", ja:"形式", ar:"الشكل", hi:"रूप" },
    "Global interactions": { es:"Interacciones globales", fr:"Interactions mondiales", de:"Globale Interaktionen", pt:"Interações globais", zh:"全球互动", ja:"グローバルな相互作用", ar:"التفاعلات العالمية", hi:"वैश्विक अंतःक्रियाएं" },
    "Identity": { es:"Identidad", fr:"Identité", de:"Identität", pt:"Identidade", zh:"身份", ja:"アイデンティティ", ar:"الهوية", hi:"पहचान" },
    "Logic": { es:"Lógica", fr:"Logique", de:"Logik", pt:"Lógica", zh:"逻辑", ja:"論理", ar:"المنطق", hi:"तर्क" },
    "Perspective": { es:"Perspectiva", fr:"Perspective", de:"Perspektive", pt:"Perspetiva", zh:"视角", ja:"視点", ar:"المنظور", hi:"दृष्टिकोण" },
    "Relationships": { es:"Relaciones", fr:"Relations", de:"Beziehungen", pt:"Relações", zh:"关系", ja:"関係", ar:"العلاقات", hi:"संबंध" },
    "Systems": { es:"Sistemas", fr:"Systèmes", de:"Systeme", pt:"Sistemas", zh:"系统", ja:"システム", ar:"الأنظمة", hi:"प्रणालियाँ" },
    "Time, place and space": { es:"Tiempo, lugar y espacio", fr:"Temps, lieu et espace", de:"Zeit, Ort und Raum", pt:"Tempo, lugar e espaço", zh:"时间、地点和空间", ja:"時間、場所、空間", ar:"الزمان والمكان والفضاء", hi:"समय, स्थान और अंतरिक्ष" }
  };
  var lastAudioLang = "en";

  var grid = document.getElementById("grid");
  var coverView = document.getElementById("coverView");
  var detailView = document.getElementById("detailView");
  var detailBadge = document.getElementById("detailBadge");
  var detailTagline = document.getElementById("detailTagline");
  var detailTitle = document.getElementById("detailTitle");
  var promptCard = document.getElementById("promptCard");
  var backBtn = document.getElementById("backBtn");
  var surpriseBtn = document.getElementById("surpriseBtn");
  var fsBtn = document.getElementById("fsBtn");
  var stage = document.getElementById("stage");
  var stageOuter = document.querySelector(".stage-outer");

  var currentCat = -1, currentIdx = -1;

  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // Draws the next index for a category by cycling through a shuffled
  // pass of every option before any option repeats, then reshuffles.
  function drawNext(cat){
    if(!cat._queue || cat._queue.length === 0){
      var idxs = [];
      for(var i = 0; i < cat.pool.length; i++) idxs.push(i);
      shuffle(idxs);
      if(cat._lastIdx !== undefined && idxs.length > 1 && idxs[0] === cat._lastIdx){
        var swapWith = 1 + Math.floor(Math.random() * (idxs.length - 1));
        var tmp = idxs[0]; idxs[0] = idxs[swapWith]; idxs[swapWith] = tmp;
      }
      cat._queue = idxs;
      cat._cycleLen = idxs.length;
      cat._drawPos = 0;
    }
    var next = cat._queue.shift();
    cat._drawPos = (cat._drawPos || 0) + 1;
    cat._lastIdx = next;
    return next;
  }

  function renderGrid(){
    grid.innerHTML = "";
    categories.forEach(function(cat, i){
      var btn = document.createElement("button");
      btn.className = "tile";
      btn.style.setProperty("--tile-accent", "var(--cat-" + (i+1) + ")");
      var badge = document.createElement("span");
      badge.className = "tile-badge";
      badge.textContent = cat.emoji;
      var title = document.createElement("span");
      title.className = "tile-title";
      title.textContent = cat.title;
      var teaser = document.createElement("span");
      teaser.className = "tile-teaser";
      teaser.textContent = cat.tagline;
      btn.appendChild(badge); btn.appendChild(title); btn.appendChild(teaser);
      btn.addEventListener("click", function(){ openCategory(i); });
      grid.appendChild(btn);
    });
  }

  // All three grid rows should be the same height, not just as tall as
  // their own tallest tile (which made rows with shorter taglines look
  // visibly smaller). Row height is derived from the actual space
  // available for the grid, split evenly three ways — not from content —
  // so the three rows can never together demand more room than the stage
  // has. Any single tile whose own text is longer than that (rare — most
  // categories fit comfortably) scrolls internally rather than being cut
  // off or forcing the whole grid to overflow.
  function equalizeGridRows(){
    var cs = getComputedStyle(grid);
    var gapPx = parseFloat(cs.rowGap || cs.gap) || 0;
    var padTop = parseFloat(cs.paddingTop) || 0;
    var padBottom = parseFloat(cs.paddingBottom) || 0;
    var avail = grid.clientHeight - padTop - padBottom - gapPx * 2;
    var perRow = Math.floor(avail / 3);
    if(perRow > 0){
      grid.style.gridTemplateRows = "repeat(3, " + perRow + "px)";
    }
  }

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // Browsers often ship several installed voices per language of very
  // different quality (a robotic offline one alongside a much more
  // natural-sounding network/"neural" one). Picks the best match available
  // rather than whatever the browser defaults to.
  function pickVoice(bcp47){
    var voices = window.speechSynthesis.getVoices() || [];
    var lang2 = bcp47.split("-")[0].toLowerCase();
    var candidates = voices.filter(function(v){
      return v.lang && v.lang.toLowerCase().indexOf(lang2) === 0;
    });
    if(!candidates.length) return null;
    function qualityRank(v){
      var n = v.name.toLowerCase();
      if(n.indexOf("google") !== -1) return 3;
      if(n.indexOf("natural") !== -1 || n.indexOf("neural") !== -1 || n.indexOf("premium") !== -1 || n.indexOf("enhanced") !== -1 || n.indexOf("online") !== -1) return 3;
      if(v.localService === false) return 2;
      return 1;
    }
    candidates.sort(function(a, b){
      var exactA = a.lang.toLowerCase() === bcp47.toLowerCase() ? 1 : 0;
      var exactB = b.lang.toLowerCase() === bcp47.toLowerCase() ? 1 : 0;
      if(exactA !== exactB) return exactB - exactA;
      return qualityRank(b) - qualityRank(a);
    });
    return candidates[0];
  }

  function speakConcept(word, langKey){
    if(!("speechSynthesis" in window)){
      alert("Sorry — this device's browser doesn't support spoken audio.");
      return;
    }
    var lang = AUDIO_LANGS.filter(function(l){ return l.key === langKey; })[0] || AUDIO_LANGS[0];
    var spoken = word;
    if(lang.key !== "en" && CONCEPT_TRANSLATIONS[word] && CONCEPT_TRANSLATIONS[word][lang.key]){
      spoken = CONCEPT_TRANSLATIONS[word][lang.key];
    }
    var utter = new SpeechSynthesisUtterance(spoken);
    utter.lang = lang.speechLang;
    var voice = pickVoice(lang.speechLang);
    if(voice) utter.voice = voice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  // Voice lists load asynchronously in some browsers — warm it up early
  // so the first "Say it" click already has the full list to pick from.
  if("speechSynthesis" in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function(){};
  }

  function renderPrompt(){
    var cat = categories[currentCat];
    var raw = cat.pool[currentIdx];
    var text = cat.template ? cat.template.replace("{item}", raw) : raw;
    var html = "";
    html += '<p class="prompt-counter">Draw ' + (cat._drawPos || 1) + ' of ' + (cat._cycleLen || cat.pool.length) + '</p>';
    html += '<p class="prompt-text">' + esc(text) + '</p>';
    if(cat.footNote) html += '<p class="prompt-foot">' + esc(cat.footNote) + '</p>';
    if(cat.hasAudio){
      html += '<div class="audio-row">';
      html += '<select class="lang-select" id="langSelect" aria-label="Choose a language">';
      html += AUDIO_LANGS.map(function(l){
        return '<option value="' + l.key + '"' + (l.key === lastAudioLang ? ' selected' : '') + '>' + l.label + '</option>';
      }).join("");
      html += '</select>';
      html += '<button class="speak-btn" id="speakBtn">🔊 Say it</button>';
      html += '</div>';
    }
    html += '<div class="prompt-actions"><button class="pill-btn ghost" id="rerollBtn">↻ Draw another</button></div>';
    promptCard.innerHTML = html;
    var reroll = document.getElementById("rerollBtn");
    if(reroll){
      reroll.addEventListener("click", function(){
        currentIdx = drawNext(cat);
        renderPrompt();
      });
    }
    var langSelect = document.getElementById("langSelect");
    var speakBtn = document.getElementById("speakBtn");
    if(speakBtn && langSelect){
      langSelect.addEventListener("change", function(){ lastAudioLang = langSelect.value; });
      speakBtn.addEventListener("click", function(){
        lastAudioLang = langSelect.value;
        speakConcept(text, langSelect.value);
      });
    }
  }

  function renderSteps(){
    var cat = categories[currentCat];
    var html = '<ol class="steps-list">' + cat.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ol>';
    if(cat.footNote) html += '<p class="prompt-foot">' + esc(cat.footNote) + '</p>';
    promptCard.innerHTML = html;
  }

  function openCategory(i){
    currentCat = i;
    var cat = categories[i];
    detailBadge.textContent = cat.emoji;
    detailBadge.style.setProperty("--tile-accent", "var(--cat-" + (i+1) + ")");
    detailTagline.textContent = cat.tagline;
    detailTitle.textContent = cat.title;
    if(cat.mode === "random"){
      currentIdx = drawNext(cat);
      renderPrompt();
    } else {
      renderSteps();
    }
    coverView.hidden = true;
    detailView.hidden = false;
  }

  backBtn.addEventListener("click", function(){
    detailView.hidden = true;
    coverView.hidden = false;
  });

  surpriseBtn.addEventListener("click", function(){
    openCategory(Math.floor(Math.random() * categories.length));
  });

  fsBtn.addEventListener("click", function(){
    if(!document.fullscreenElement){
      (stageOuter.requestFullscreen && stageOuter.requestFullscreen()) ||
      (stageOuter.webkitRequestFullscreen && stageOuter.webkitRequestFullscreen());
    } else {
      document.exitFullscreen ? document.exitFullscreen() : (document.webkitExitFullscreen && document.webkitExitFullscreen());
    }
  });

  document.addEventListener("fullscreenchange", function(){
    stage.classList.toggle("is-fullscreen", !!document.fullscreenElement);
    fitStage();
  });

  function fitStage(){
    var pad = document.fullscreenElement ? 0 : 22;
    var availW = window.innerWidth - pad*2;
    var availH = window.innerHeight - pad*2;
    var scale = Math.min(availW/1280, availH/720);
    if(!isFinite(scale) || scale <= 0) scale = 1;
    stage.style.transform = "translate(-50%,-50%) scale(" + scale + ")";
  }
  window.addEventListener("resize", fitStage);

  renderGrid();
  equalizeGridRows();
  fitStage();
})();
</script>
